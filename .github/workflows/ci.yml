name: CI

# This repo ships no JUnit or GameTest suite, so the template's junit/gametest
# jobs do not apply - only the version-bump guard does, and it needs no JDK or
# build: a pure git/gh diff check. The junit/gametest jobs land when a suite does.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Enforced since #52: findings fail this step (ignoreFailures dropped
      # from build.gradle). The report still uploads below via if: always().
      - name: SpotBugs
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || github.token }}
        run: ./gradlew spotbugsMain --no-daemon --stacktrace

      # Enforced since #52: violations fail this step and so the static
      # check. Spotless stays out of Gradle `check` (enforceCheck false),
      # so junit's `./gradlew build` remains style-agnostic - this job is
      # the style gate.
      # Structural rules, not formatting: comment-block length, star/redundant/
      # unused imports, cyclomatic complexity. Ruleset: config/checkstyle.
      - name: Checkstyle
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || github.token }}
        run: >
          ./gradlew checkstyleMain
          --no-daemon --stacktrace

      - name: Spotless check
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || github.token }}
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Upload the SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          if-no-files-found: ignore
      - name: Upload the Checkstyle report

        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/
          if-no-files-found: ignore

  version-bump:
    name: version-bump
    runs-on: ubuntu-latest

    # Label creation is issue-scoped, so this one job asks for more than the
    # workflow's read-only default. Everything it already does stays read; the only
    # write is the label below.
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the breaking label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The PR template tells authors to apply the `breaking` label and the
          # magnitude rule below reads merged PRs by it, but labels live per
          # repository and nothing created them - so the query could only ever come
          # back empty and a breaking change could ship in a patch release with CI
          # green. Creating it here means every repo running this workflow carries
          # the label without anyone having clicked it into existence.
          #
          # Only created when missing, so a label someone has recoloured or
          # re-described is left alone. A fork PR runs with a read-only token and
          # cannot create it: warn loudly rather than fail the check, because a red
          # required check would block the whole external contribution.
          if gh label view breaking --repo "$REPO" >/dev/null 2>&1; then
            echo "breaking label already present in $REPO."
            exit 0
          fi

          if gh label create breaking --repo "$REPO" --color b60205 \
               --description "Breaking change: the next clean bump must raise major or minor"; then
            echo "created the breaking label in $REPO."
          else
            echo "::warning::Could not create the 'breaking' label - a fork PR has a read-only token. Add it by hand, or re-run from a branch in this repo."
          fi

      - name: Enforce the version doctrine (bumps ride CI/CD)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # On workflow_dispatch (the version-bump path: version-bump.yml runs
          # `gh workflow run ci.yml --ref <branch>`) there is no pull_request
          # event, so BASE falls back to the default branch NAME - and that
          # checkout only materializes the dispatched ref. Git's revision DWIM
          # does not walk to refs/remotes/origin/<name>, so `git diff main ...`
          # dies with "ambiguous argument" (exit 128). Compare against the
          # remote-tracking ref instead; fetch it if even that is missing.
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{40}$'; then
            BASE="origin/$BASE"
            if ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags origin "+refs/heads/${BASE#origin/}:refs/remotes/origin/${BASE#origin/}"
            fi
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "--- changed files ---"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -q '^gradle\.properties$'; then
            echo "No version files in this PR. The -alpha slot is owned by CI/CD post-merge (version-bump-post-merge.yml). OK."
            exit 0
          fi

          EXTRA=$(echo "$CHANGED" | grep -v '^gradle\.properties$' | grep -v '^$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::Version bumps ride CI/CD after merge (neoforge-mod-template#81)."
            echo "::error::A PR must not bundle gradle.properties with other changes. These files must not accompany it:"
            echo "$EXTRA"
            echo "::error::Revert the gradle.properties change from this PR, or split the bump into its own isolated PR."
            exit 1
          fi

          NEW_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "Isolated version bump to $NEW_VERSION. OK (the stable/beta path)."

      - name: Enforce breaking changes require a major or minor bump
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Same dispatch fallback as above: on workflow_dispatch BASE is the
          # default branch name, which this checkout has no local ref for -
          # resolve it to the remote-tracking ref before `git show` uses it.
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9a-f]{40}$'; then
            BASE="origin/$BASE"
            if ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags origin "+refs/heads/${BASE#origin/}:refs/remotes/origin/${BASE#origin/}"
            fi
          fi

          NEW_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          OLD_VERSION=$(git show "$BASE:gradle.properties" | grep '^mod_version=' | cut -d= -f2 | tr -d '[:space:]')

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "No version bump. Magnitude rule does not apply."
            exit 0
          fi

          case "$NEW_VERSION" in
            *-*) SUFFIXED="yes" ;;
            *)   SUFFIXED="no" ;;
          esac

          if [ "$SUFFIXED" = "yes" ]; then
            echo "Pre-release bump. Magnitude rule applies to the next clean bump, not this one."
            exit 0
          fi

          BASELINE=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

          if [ -z "$BASELINE" ]; then
            echo "No stable tag exists yet. Nothing to be compatible with. OK."
            exit 0
          fi

          echo "last stable tag: $BASELINE"

          BREAKING=$(gh pr list --state merged --label breaking --search "merged:>=$(git log -1 --format=%cI "$BASELINE")" --json number --jq '.[].number' || true)

          if [ -z "$BREAKING" ]; then
            echo "No breaking PRs merged since $BASELINE. Any bump is permitted. OK."
            exit 0
          fi

          echo "breaking PRs since $BASELINE: $BREAKING"

          OLD_BASE="${BASELINE#v}"
          MAJOR_OLD=$(echo "$OLD_BASE" | cut -d. -f1)
          MINOR_OLD=$(echo "$OLD_BASE" | cut -d. -f2)
          MAJOR_NEW=$(echo "$NEW_VERSION" | cut -d. -f1)
          MINOR_NEW=$(echo "$NEW_VERSION" | cut -d. -f2)

          if [ "$MAJOR_NEW" -gt "$MAJOR_OLD" ] || [ "$MINOR_NEW" -gt "$MINOR_OLD" ]; then
            echo "Bump $OLD_BASE -> $NEW_VERSION raises major or minor. OK."
            exit 0
          fi

          echo "::error::Breaking changes are outstanding since $BASELINE (PRs: $BREAKING)."
          echo "::error::A breaking change cannot ship in a patch release."
          echo "::error::Bump $OLD_BASE to a higher major or minor version, not $NEW_VERSION."
          exit 1