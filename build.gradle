plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation("com.google.guava:guava:33.5.0-jre") { because("Security/compat override requested.") }
    implementation("io.netty:netty-codec:4.2.7.Final") { because("Security/compat override requested.") }
    implementation("io.netty:netty-handler:4.2.7.Final") { because("Security/compat override requested.") }
    implementation("org.apache.commons:commons-compress:1.27.1") { because("Security/compat override requested.") }

    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// This ForgeGradle build publishes the jar artifact directly, as before.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/enchantment-packs')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (report-only grace period) ----------------------------
// Both tools run as the `static` CI job. During the grace period neither can
// block a build: SpotBugs findings are recorded but never fail the task, and
// Spotless is detached from `check` (enforceCheck false) so the junit job's
// `./gradlew build` stays style-agnostic. Gating flips on in a follow-up once
// the finding volume is known; that follow-up also runs one spotlessApply per
// repo to clear the baseline.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
